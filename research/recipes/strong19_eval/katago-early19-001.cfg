# Qualification only. All defaults are pinned by the recorded KataGo source commit.
rules = tromp-taylor
maxVisits = 2
numSearchThreads = 1
numEigenThreadsPerModel = 1
numNNServerThreadsPerModel = 1
nnMaxBatchSize = 1
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 12
ponderingEnabled = false
allowResignation = false
resignThreshold = -1.0
rootNoiseEnabled = false
chosenMoveTemperature = 0
chosenMoveTemperatureEarly = 0
rootSymmetryPruning = false
rootNumSymmetriesToSample = 1
conservativePass = false
cleanupBeforePass = false
friendlyPass = false
preventCleanupPhase = false
playoutDoublingAdvantage = 0
searchRandSeed = gozero-qualification-1
nnRandSeed = gozero-qualification-1
logSearchInfo = true
logAllGTPCommunication = false
logToStderr = true
